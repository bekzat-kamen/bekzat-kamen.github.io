<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Бегзат Камен | Системный и бизнес-аналитик</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #0d1117;
      --card-bg: #161b22;
      --card-border: #30363d;
      --text-main: #c9d1d9;
      --text-white: #f0f6fc;
      --text-muted: #8b949e;
      --primary: #58a6ff;
      --primary-hover: #1f6feb;
      --accent: #238636;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: var(--font-sans);
      line-height: 1.6;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 0 20px;
    }

    /* Navbar */
    .navbar {
      position: sticky;
      top: 0;
      background: rgba(13, 17, 23, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--card-border);
      z-index: 100;
      padding: 16px 0;
    }
    .nav-container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 0 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--text-white);
      font-family: var(--font-mono);
    }
    .dot {
      color: var(--primary);
    }
    .nav-links a {
      color: var(--text-muted);
      text-decoration: none;
      margin-left: 20px;
      font-size: 0.95rem;
      transition: color 0.2s;
    }
    .nav-links a:hover {
      color: var(--text-white);
    }
    .nav-links .btn-contact {
      color: var(--primary);
      border: 1px solid var(--primary);
      padding: 6px 14px;
      border-radius: 6px;
    }
    .nav-links .btn-contact:hover {
      background: rgba(88, 166, 255, 0.1);
    }

    /* Hero */
    .hero {
      padding: 70px 0 50px;
    }
    .hero-badge {
      display: inline-block;
      background: rgba(88, 166, 255, 0.15);
      color: var(--primary);
      border: 1px solid rgba(88, 166, 255, 0.3);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 500;
      margin-bottom: 20px;
    }
    .hero h1 {
      font-size: 2.8rem;
      font-weight: 800;
      color: var(--text-white);
      line-height: 1.2;
      margin-bottom: 15px;
    }
    .hero .subtitle {
      font-size: 1.15rem;
      color: var(--text-muted);
      max-width: 720px;
      margin-bottom: 30px;
    }
    .hero-metrics {
      display: flex;
      gap: 30px;
      margin-bottom: 35px;
      flex-wrap: wrap;
    }
    .metric {
      display: flex;
      flex-direction: column;
    }
    .metric .num {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-white);
      font-family: var(--font-mono);
    }
    .metric .label {
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .hero-actions {
      display: flex;
      gap: 15px;
    }
    .btn {
      display: inline-block;
      padding: 12px 22px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.95rem;
      text-decoration: none;
      transition: all 0.2s;
    }
    .btn.primary {
      background-color: var(--primary);
      color: #0b0f19;
    }
    .btn.primary:hover {
      background-color: var(--primary-hover);
      color: #fff;
    }
    .btn.secondary {
      border: 1px solid var(--card-border);
      background-color: var(--card-bg);
      color: var(--text-white);
    }
    .btn.secondary:hover {
      border-color: var(--text-muted);
    }

    /* Sections */
    .section {
      padding: 55px 0;
      border-top: 1px solid var(--card-border);
    }
    .section-title {
      font-size: 1.8rem;
      color: var(--text-white);
      margin-bottom: 10px;
    }
    .section-subtitle {
      color: var(--text-muted);
      margin-bottom: 25px;
    }

    /* Skills Grid */
    .skills-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }
    .skill-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 24px;
      border-radius: 12px;
      transition: transform 0.2s, border-color 0.2s;
    }
    .skill-card:hover {
      transform: translateY(-3px);
      border-color: var(--primary);
    }
    .card-icon {
      font-size: 1.8rem;
      margin-bottom: 12px;
    }
    .skill-card h3 {
      color: var(--text-white);
      font-size: 1.15rem;
      margin-bottom: 10px;
    }
    .skill-card p {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 18px;
    }
    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .tags span {
      background: #21262d;
      color: #79c0ff;
      border: 1px solid #388bfd33;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-family: var(--font-mono);
    }

    /* Timeline */
    .timeline {
      position: relative;
      margin-top: 30px;
      padding-left: 20px;
      border-left: 2px solid var(--card-border);
    }
    .timeline-item {
      position: relative;
      margin-bottom: 35px;
    }
    .timeline-marker {
      position: absolute;
      left: -27px;
      top: 6px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background-color: var(--primary);
      border: 3px solid var(--bg-color);
    }
    .timeline-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      flex-wrap: wrap;
      margin-bottom: 4px;
    }
    .timeline-header h3 {
      font-size: 1.2rem;
      color: var(--text-white);
    }
    .timeline-header .period {
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .timeline-content .company {
      color: var(--primary);
      font-weight: 500;
      margin-bottom: 12px;
    }
    .timeline-content ul {
      padding-left: 20px;
      color: var(--text-muted);
      font-size: 0.95rem;
    }
    .timeline-content li {
      margin-bottom: 8px;
    }

    /* Artifacts */
    .artifact-box {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      margin-bottom: 25px;
      overflow: hidden;
    }
    .artifact-header {
      padding: 14px 18px;
      background: #21262d;
      border-bottom: 1px solid var(--card-border);
    }
    .artifact-header .badge {
      display: inline-block;
      background: rgba(35, 134, 54, 0.2);
      color: #3fb950;
      border: 1px solid rgba(63, 185, 80, 0.4);
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 4px;
      font-family: var(--font-mono);
      margin-bottom: 6px;
    }
    .artifact-header h4 {
      color: var(--text-white);
      font-size: 1rem;
    }
    .artifact-content {
      padding: 20px;
      overflow-x: auto;
    }
    .code-block pre {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      color: #79c0ff;
      line-height: 1.5;
    }

    /* Contacts */
    .contact-card {
      background: linear-gradient(180deg, #161b22 0%, #0d1117 100%);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 40px 20px;
      text-align: center;
    }
    .contact-card h2 {
      color: var(--text-white);
      font-size: 2rem;
      margin-bottom: 10px;
    }
    .contact-card p {
      color: var(--text-muted);
      max-width: 600px;
      margin: 0 auto 30px;
    }
    .contact-methods {
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
    }
    .contact-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #21262d;
      border: 1px solid var(--card-border);
      padding: 12px 18px;
      border-radius: 8px;
      text-decoration: none;
      text-align: left;
      transition: border-color 0.2s;
    }
    .contact-item:hover {
      border-color: var(--primary);
    }
    .contact-item .icon {
      font-size: 1.3rem;
    }
    .contact-item .label {
      font-size: 0.75rem;
      color: var(--text-muted);
    }
    .contact-item .val {
      font-size: 0.9rem;
      color: var(--text-white);
      font-weight: 500;
    }

    /* Footer */
    .footer {
      padding: 35px 0;
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-muted);
      border-top: 1px solid var(--card-border);
    }

    @media (max-width: 768px) {
      .hero h1 { font-size: 2.1rem; }
      .nav-links { display: none; }
      .contact-methods { flex-direction: column; }
    }
  </style>

  <!-- Подключение Mermaid.js для отрисовки Sequence Diagram прямо в браузере -->
  <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
    mermaid.initialize({ startOnLoad: true, theme: 'dark' });
  </script>
</head>
